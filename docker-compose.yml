services:
  postgres:
    image: postgres:16-alpine
    container_name: dealflow360_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealflow_user
      POSTGRES_PASSWORD: dealflow_password
      POSTGRES_DB: dealflow360_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow_user -d dealflow360_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
